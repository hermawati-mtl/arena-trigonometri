<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Trigonometri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--bg1:#eaf1ff;--bg2:#c7dbff;--card:rgba(255,255,255,.8);--tx:#0c1f4a;--mu:#5a6b94;--pr:#1d4ed8;--pr2:#3b82f6;--bd:rgba(29,78,216,.2);--ok:#059669;--no:#e11d48;--wv:29,78,216;--gd:#c99a2e;--sh:0 10px 30px rgba(20,50,130,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#050d24;--bg2:#0b2054;--card:rgba(18,38,92,.6);--tx:#eaf1ff;--mu:#93a8d8;--pr:#3b82f6;--pr2:#60a5fa;--bd:rgba(147,180,255,.22);--wv:120,170,255;--gd:#e6b84a;--sh:0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg1:#050d24;--bg2:#0b2054;--card:rgba(18,38,92,.6);--tx:#eaf1ff;--mu:#93a8d8;--pr:#3b82f6;--pr2:#60a5fa;--bd:rgba(147,180,255,.22);--wv:120,170,255;--gd:#e6b84a;--sh:0 10px 30px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--tx);font-family:Poppins,system-ui,sans-serif;line-height:1.45}
canvas{position:fixed;inset:0;pointer-events:none}
#app{position:relative;max-width:1100px;margin:0 auto;padding:16px 16px 40px}
.serif{font-family:"Playfair Display",Georgia,serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);backdrop-filter:blur(10px)}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;transition:.2s}
button:hover:not(:disabled){transform:translateY(-2px)}
button:disabled{cursor:default;opacity:.55}
.pri{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;font-weight:600;padding:13px 26px;box-shadow:0 8px 20px rgba(59,130,246,.4)}
input{font:inherit;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.hero{text-align:center;padding:28px 0 8px}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);margin:0;font-weight:800;letter-spacing:.5px}
.hero small{letter-spacing:.3em;text-transform:uppercase;color:var(--mu);font-size:.72rem}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0}
.chips span{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:4px 12px;font-size:.82rem}
.ng{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:14px 0}
.ng div{display:flex;gap:8px;align-items:center}
.dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:.85rem}
#mus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:9;display:flex;gap:8px;align-items:center;padding:6px 10px}
#mus input{width:80px;padding:0}
.top{display:flex;align-items:center;gap:12px;margin:38px 0 12px}
.bar{flex:1;height:8px;border-radius:8px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));transition:width .5s}
.pill{font-weight:600;white-space:nowrap}
.ring{position:relative;width:64px;height:64px;flex:none}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.2rem}
.ring circle{fill:none;stroke-width:6}.ring .fg{stroke:var(--pr2);stroke-linecap:round;stroke-dasharray:163.4;transition:stroke-dashoffset 1s linear,stroke .3s}
.ring.w .fg{stroke:var(--no)}.ring.w{animation:pl .5s infinite}
@keyframes pl{50%{transform:scale(1.1)}}
.main{display:grid;grid-template-columns:1fr 290px;gap:14px}
@media(max-width:820px){.main{grid-template-columns:1fr}}
.q{font-size:clamp(1.15rem,3vw,1.6rem);font-weight:600;margin:0 0 12px;animation:up .5s}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;font-size:1.05rem;background:var(--card);animation:up .5s backwards}
.opt b{color:var(--pr2);margin-right:6px}
.opt.c{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border-color:transparent;transform:scale(1.03)}.opt.c b{color:#fff}
.opt.d{opacity:.45}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:14px}
.g{padding:12px;animation:up .5s backwards}
.g .h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:600;font-size:.92rem}
.g .h span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ab button{padding:8px 0;font-weight:600}
.ab button:hover:not(:disabled){background:var(--pr);color:#fff}
.st{font-size:.8rem;color:var(--mu);margin-top:6px;min-height:1.2em}
.g.ok{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok),var(--sh)}
.g.no{animation:sk .4s}.g.no .st{color:var(--no)}.g.ok .st{color:var(--ok);font-weight:600}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ctl{display:flex;align-items:center;gap:12px;margin-top:14px}
.lb{position:relative;align-self:start}
.lr{position:absolute;left:0;right:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 6px;border-radius:10px;transition:transform .8s cubic-bezier(.2,.8,.2,1);font-size:.9rem}
.lr:nth-child(odd){background:rgba(var(--wv),.07)}
.lr .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lr .r{width:22px;text-align:center}
.dot.s{width:22px;height:22px;font-size:.7rem}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:26px 0 10px;min-height:280px}
.pod div{flex:1;max-width:210px;text-align:center;border-radius:16px 16px 0 0;padding:14px 8px;color:#fff;font-weight:600;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) backwards;box-shadow:var(--sh)}
.pod .e{font-size:2.2rem;display:block}.pod .p{font-size:1.4rem;font-weight:800;display:block}
@keyframes rise{from{height:0!important;opacity:0}}
.rk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.rk span{flex:1}
.fl{position:fixed;pointer-events:none;font-weight:800;color:var(--ok);animation:fl 1.2s forwards;z-index:8}
@keyframes fl{to{transform:translateY(-50px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="bg"></canvas><canvas id="cf"></canvas>
<div id="mus" class="card"><button id="mb" title="Efek suara">🔊</button></div>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),T=25,L="ABCD",COL=["#2563eb","#0891b2","#7c3aed","#0d9488","#d97706","#db2777","#16a34a","#ea580c"];
const Q=[
["Amplitudo dari y = 4 sin x adalah ...",["4","2","1","8"]],
["Periode dari y = sin 2x adalah ...",["π","2π","π/2","4π"]],
["Periode dari y = cos(x/2) adalah ...",["4π","π","2π","8π"]],
["Amplitudo dari y = −3 cos 2x adalah ...",["3","−3","2","6"]],
["Periode dari y = tan 3x adalah ...",["60°","120°","180°","90°"]],
["Periode dari y = 5 sin 3x adalah ...",["120°","360°","60°","180°"]],
["Nilai maksimum y = 2 sin x + 3 adalah ...",["5","2","3","1"]],
["Nilai minimum y = 4 cos x − 1 adalah ...",["−5","−4","−3","3"]],
["Grafik sinus dengan amplitudo 2 dan periode π memiliki persamaan ...",["y = 2 sin 2x","y = 2 sin x","y = π sin 2x","y = 2 sin(x/2)"]],
["Grafik cosinus dengan amplitudo 5 dan periode 4π memiliki persamaan ...",["y = 5 cos(x/2)","y = 5 cos 2x","y = 4 cos 5x","y = 5 cos 4x"]],
["Periode dari y = 3 sin(2x − π/3) adalah ...",["π","2π","π/3","3π"]],
["Grafik y = sin(x − π/4) merupakan pergeseran grafik y = sin x sejauh π/4 ke ...",["kanan","kiri","atas","bawah"]],
["Periode dari y = cos(πx) adalah ...",["2","2π","1","π"]],
["Pada y = a sin(bx + c) + d, nilai yang menyatakan garis tengah (sumbu simetri) grafik adalah ...",["d","a","b","c"]],
["Rumus periode y = a sin(bx + c) + d (dalam derajat) adalah ...",["360°/|b|","360°·b","180°/|b|","360°/a"]],
["Amplitudo dan periode y = 2 cos 3x + 1 berturut-turut adalah ...",["2 dan 120°","3 dan 120°","2 dan 360°","1 dan 60°"]],
["Grafik sinus bernilai maksimum 6 dan minimum −2. Amplitudonya adalah ...",["4","8","2","6"]],
["Amplitudo dan periode y = −2 sin 3x berturut-turut adalah ...",["2 dan 2π/3","−2 dan 2π/3","2 dan 3π","3 dan 2π/3"]],
["Fungsi cosinus bernilai maksimum 7, minimum −1, periode π. Persamaannya ...",["y = 4 cos 2x + 3","y = 4 cos x + 3","y = 3 cos 2x + 4","y = 8 cos 2x + 3"]],
["Periode dari y = tan(x/2) adalah ...",["2π","π","π/2","4π"]]];
/* ===== Efek suara ===== */
let mute=false,ac;
$("#mb").onclick=()=>{mute=!mute;$("#mb").textContent=mute?"🔇":"🔊"};
function tone(f,d,t="sine",v=.12,dl=0){if(mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+dl;o.type=t;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const sfx={click:()=>tone(660,.1),tick:()=>tone(900,.06,"square",.05),ok:()=>[523,659,784,1047].forEach((f,k)=>tone(f,.25,"triangle",.14,k*.09)),no:()=>{tone(220,.3,"sawtooth",.08);tone(165,.35,"sawtooth",.08,.15)},win:()=>[523,659,784,1047,784,1047,1319].forEach((f,k)=>tone(f,.35,"triangle",.15,k*.14))};
/* ===== Latar gelombang sinus ===== */
const bg=$("#bg"),bx=bg.getContext("2d"),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;let wv="120,170,255",fr=0;
function rs(){bg.width=innerWidth;bg.height=innerHeight}addEventListener("resize",rs);rs();
function wave(t){if(fr++%60==0)wv=getComputedStyle(document.documentElement).getPropertyValue("--wv").trim();bx.clearRect(0,0,bg.width,bg.height);
for(let l=0;l<4;l++){bx.beginPath();for(let x=0;x<=bg.width;x+=8){const y=bg.height*(.62+.09*l)+Math.sin(x/(110+45*l)+t/(1100+350*l))*(26+9*l);x?bx.lineTo(x,y):bx.moveTo(x,y)}
bx.strokeStyle=`rgba(${wv},${.2-.04*l})`;bx.lineWidth=2;bx.stroke()}if(!rm)requestAnimationFrame(wave)}
wave(0);
/* ===== Confetti ===== */
const cf=$("#cf"),cx=cf.getContext("2d");let ps=[],cr=0;
function rc(){cf.width=innerWidth;cf.height=innerHeight}addEventListener("resize",rc);rc();
function burst(n,x=innerWidth/2,y=innerHeight/3,sp=9){const c=["#3b82f6","#60a5fa","#93c5fd","#ffffff","#e6b84a","#38bdf8"];for(let k=0;k<n;k++){const a=Math.random()*6.28,s=Math.random()*sp+2;ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:Math.random()*6+3,c:c[k%6],l:110})}if(!cr){cr=1;lp()}}
function lp(){cx.clearRect(0,0,cf.width,cf.height);ps=ps.filter(p=>p.l>0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.l--;cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*.6)});cx.globalAlpha=1;ps.length?requestAnimationFrame(lp):(cr=0,cx.clearRect(0,0,cf.width,cf.height))}
/* ===== Game ===== */
let N,S,ST,TT,P,PT,E,i,rev,tl,tm,C,TB,mode=0,act=[],tbi=0,done=new Set();
let CT;const CT0=[
["Periode dari y = 2 sin(3x − π) + 5 adalah ...",["2π/3","2π","π/3","3π"]],
["Nilai maksimum dan minimum y = 3 − 2 cos x berturut-turut adalah ...",["5 dan 1","5 dan −1","3 dan −2","2 dan −2"]],
["Grafik sinus beramplitudo 3, periode 4π, dan garis tengah y = 1 memiliki persamaan ...",["y = 3 sin(x/2) + 1","y = 3 sin 2x + 1","y = sin(x/2) + 3","y = 3 sin 4x + 1"]],
["Periode dari y = 2 tan(x/3 + π) adalah ...",["3π","π/3","6π","π"]],
["Fungsi y = a cos(bx) + c bernilai maksimum 8, minimum 2, dan periode 120°. Nilai a + b + c adalah ...",["11","8","14","9"]]];
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const dot=(g,c="")=>`<span class="dot ${c}" style="background:${COL[g]}">${g+1}</span>`;
const order=()=>[...Array(8).keys()].sort((a,b)=>S[b]-S[a]||TB[b]-TB[a]||TT[a]-TT[b]||a-b);
function intro(){clearInterval(tm);
$("#app").innerHTML=`<div class="hero"><small>Kompetisi 8 Kelompok</small><h1 class="serif">Arena Trigonometri</h1>
<div class="mu" style="color:var(--mu);margin-top:6px">Periode · Amplitudo · Persamaan Umum Fungsi Trigonometri</div>
<svg viewBox="0 0 300 40" width="260" style="margin-top:8px"><path d="M0 20 Q37 -8 75 20 T150 20 T225 20 T300 20" fill="none" stroke="var(--pr2)" stroke-width="2.5"/></svg></div>
<div class="chips"><span>📝 20 soal</span><span>⏱ ${T} detik/soal</span><span>⭐ 100 poin + bonus cepat</span><span>🔥 Streak 3× +25</span></div>
<div class="card"><b>Nama kelompok</b><div class="ng">${[...Array(8)].map((_,k)=>`<div>${dot(k)}<input id="n${k}" maxlength="16" value="Kelompok ${k+1}"></div>`).join("")}</div>
<div style="text-align:center"><button class="pri" onclick="start()">Mulai Pertandingan ▶</button></div>
<p style="color:var(--mu);font-size:.85rem;text-align:center;margin:12px 0 0">Tiap kelompok menekan jawaban di kartunya. Jawaban terkunci begitu dipilih, jadi jawab cepat dan tepat!</p></div>`}
function start(){N=[...Array(8)].map((_,k)=>$("#n"+k).value.trim()||"Kelompok "+(k+1));
S=Array(8).fill(0);ST=Array(8).fill(0);TT=Array(8).fill(0);E=Array(8).fill(0);TB=Array(8).fill(0);mode=0;done=new Set();
const mk=q=>{const o=q[1].map(t=>[t,1]).sort(()=>Math.random()-.5);return{q:q[0],o:o.map(x=>x[0]),a:o.findIndex(x=>x[0]===q[1][0])}};C=Q.map(mk);CT=CT0.map(mk);
i=0;sfx.click();showQ()}
function showQ(){const c=mode?CT[tbi]:C[i];P=N.map((_,g)=>mode&&!act.includes(g)?-2:-1);PT=Array(8).fill(0);rev=false;tl=T;const od=order();
$("#app").innerHTML=`<div class="top"><span class="pill">${mode?"⚔️ Tie-Break "+(tbi+1)+"/5":"Soal "+(i+1)+"/20"}</span><div class="bar"><i style="width:${mode?tbi*20:i*5}%"></i></div>
<div class="ring" id="rg"><svg width="64" height="64"><circle cx="32" cy="32" r="26" stroke="var(--bd)"/><circle class="fg" id="fg" cx="32" cy="32" r="26" style="stroke-dashoffset:0"/></svg><b id="tn">${T}</b></div></div>
<div class="main"><div><div class="card"><p class="q serif">${c.q}</p><div class="opts">${c.o.map((t,k)=>`<div class="opt" id="o${k}" style="animation-delay:${k*.08}s"><b>${L[k]}.</b>${t}</div>`).join("")}</div></div>
<div class="gr">${N.map((n,g)=>`<div class="card g" id="g${g}" style="animation-delay:${g*.05}s${P[g]==-2?";opacity:.4":""}"><div class="h">${dot(g)}<span>${esc(n)}</span><em id="sk${g}" style="font-style:normal">${ST[g]>=2?"🔥"+ST[g]:""}</em></div>
<div class="ab">${[0,1,2,3].map(k=>`<button ${P[g]==-2?"disabled":""} onclick="pick(${g},${k})">${L[k]}</button>`).join("")}</div><div class="st" id="st${g}">${P[g]==-2?"Menonton":"Belum menjawab"}</div></div>`).join("")}</div>
<div class="ctl"><button class="pri" id="rv" onclick="reveal()">Tampilkan Jawaban</button><span id="cn" style="color:var(--mu)">0/${mode?act.length:8} menjawab</span></div></div>
<aside class="card lb"><b>🏅 Klasemen Langsung</b><div style="position:relative;height:${8*46+8}px;margin-top:10px" id="lb">${N.map((n,g)=>`<div class="lr" id="lr${g}" style="transform:translateY(${od.indexOf(g)*46}px)"><span class="r" id="rn${g}">${od.indexOf(g)+1}</span>${dot(g,"s")}<span class="n">${esc(n)}</span><b id="sc${g}">${S[g]}</b></div>`).join("")}</div></aside></div>`;
clearInterval(tm);tm=setInterval(()=>{tl--;tick();if(tl<=0)reveal()},1000)}
function tick(){$("#tn").textContent=Math.max(tl,0);$("#fg").style.strokeDashoffset=163.4*(1-Math.max(tl,0)/T);if(tl<=5&&tl>0){$("#rg").classList.add("w");sfx.tick()}}
function pick(g,k){if(rev||P[g]>=0)return;P[g]=k;PT[g]=tl;sfx.click();
document.querySelectorAll(`#g${g} button`).forEach(b=>b.disabled=true);$("#st"+g).textContent="🔒 Jawaban terkunci";
const n=P.filter(p=>p>=0).length,tt=mode?act.length:8;$("#cn").textContent=n+"/"+tt+" menjawab";if(n==tt)setTimeout(reveal,700)}
function num(el,a,b){const s=performance.now();(function f(t){const p=Math.min(1,(t-s)/800);el.textContent=Math.round(a+(b-a)*p);p<1&&requestAnimationFrame(f)})(s)}
function reveal(){if(rev)return;rev=true;clearInterval(tm);const c=mode?CT[tbi]:C[i];let any=0;const old=[...S];
c.o.forEach((_,k)=>$("#o"+k).classList.add(k===c.a?"c":"d"));
N.forEach((_,g)=>{const el=$("#g"+g),st=$("#st"+g);document.querySelectorAll(`#g${g} button`).forEach(b=>b.disabled=true);E[g]=0;if(P[g]===-2)return;
if(P[g]===c.a){let p=1;if(mode){TB[g]++;TT[g]+=T-PT[g]}else{ST[g]++;p=100+Math.round(50*PT[g]/T);if(ST[g]>=3)p+=25;E[g]=p;S[g]+=p;TT[g]+=T-PT[g]}any=1;el.classList.add("ok");st.textContent=mode?`✓ ${L[P[g]]} benar (+1 tie-break)`:`✓ ${L[P[g]]} benar  +${p}`+(ST[g]>=3?" 🔥":"");
const r=el.getBoundingClientRect(),f=document.createElement("div");f.className="fl";f.textContent=mode?"✓":"+"+p;f.style.left=r.left+r.width/2-20+"px";f.style.top=r.top+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1300)}
else{if(!mode)ST[g]=0;el.classList.add("no");st.textContent=P[g]<0?"⏱ Tidak menjawab":`✗ Memilih ${L[P[g]]}`}
$("#sk"+g).textContent=ST[g]>=2?"🔥"+ST[g]:""});
any?(sfx.ok(),burst(60)):sfx.no();
const od=order();N.forEach((_,g)=>{$("#lr"+g).style.transform=`translateY(${od.indexOf(g)*46}px)`;$("#rn"+g).textContent=od.indexOf(g)+1;num($("#sc"+g),old[g],S[g])});
const b=$("#rv");b.disabled=false;b.textContent=mode?(tbi<4?"Soal Tie-Break Berikutnya ➜":"Lihat Hasil 🏆"):(i<19?"Soal Berikutnya ➜":"Lihat Juara 🏆");b.onclick=()=>mode?(tbi<4?(tbi++,showQ()):end()):(i<19?(i++,showQ()):end())}
function tie(ts){act=ts;mode=1;tbi=0;ts.forEach(g=>done.add(g));sfx.ok();
